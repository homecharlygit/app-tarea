<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mis Tareas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0" />

  <!-- Google Identity Services (login) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Mis Tareas</h1>
      <div class="acciones-top">
        <button id="btn-cuenta" class="icon-btn-tonal" aria-label="Cuenta de Google" type="button">
          <span class="material-symbols-rounded">account_circle</span>
        </button>
        <button id="btn-color" class="icon-btn-tonal" aria-label="Color de la app" type="button">
          <span class="material-symbols-rounded">palette</span>
        </button>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab is-selected" type="button" data-panel="panel-tareas">
        <span class="material-symbols-rounded">checklist</span>Tareas
      </button>
      <button class="tab" type="button" data-panel="panel-examenes">
        <span class="material-symbols-rounded">calendar_month</span>Exámenes
      </button>
      <button class="tab" type="button" data-panel="panel-materias">
        <span class="material-symbols-rounded">palette</span>Materias
      </button>
    </nav>

    <main>
      <section id="panel-tareas" class="panel">
        <div class="chips" id="filtro-tareas">
          <button class="chip is-selected" type="button" data-filtro="pendientes">Pendientes</button>
          <button class="chip" type="button" data-filtro="hechas">Hechas</button>
        </div>
        <div id="lista-tareas" class="lista"></div>
      </section>

      <section id="panel-examenes" class="panel" hidden>
        <div id="lista-examenes" class="lista"></div>
      </section>

      <section id="panel-materias" class="panel" hidden>
        <div id="lista-materias" class="lista"></div>
      </section>
    </main>

    <button id="btn-nueva" class="fab" type="button">
      <span class="material-symbols-rounded">add</span>Nueva
    </button>

    <div id="aviso" role="status" aria-live="polite"></div>
  </div>

  <!-- Diálogo Nueva/Editar -->
  <dialog id="dialogo-elemento" class="dialogo">
    <div class="form">
      <h2 id="dialogo-titulo">Nueva tarea</h2>

      <div class="segmented" id="campo-tipo" role="radiogroup" aria-label="Tipo">
        <label class="seg-op">
          <input type="radio" name="tipo" value="tarea" checked /><span>Tarea</span>
        </label>
        <label class="seg-op">
          <input type="radio" name="tipo" value="examen" /><span>Examen</span>
        </label>
      </div>

      <label class="campo">
        <span class="etq">Título</span>
        <input type="text" id="campo-titulo" maxlength="120" autocomplete="off" />
        <span class="error" id="error-titulo"></span>
      </label>

      <label class="campo">
        <span class="etq">Materia</span>
        <select id="campo-materia"></select>
      </label>

      <label class="campo">
        <span class="etq">Fecha</span>
        <input type="date" id="campo-fecha" />
        <span class="error" id="error-fecha"></span>
      </label>

      <label class="campo">
        <span class="etq">Notas (opcional)</span>
        <textarea id="campo-notas" rows="2" maxlength="500"></textarea>
      </label>

      <div class="acciones">
        <button id="btn-borrar" class="btn-ghost" type="button">Borrar</button>
        <span class="espaciador"></span>
        <button id="btn-cancelar" class="btn-ghost" type="button">Cancelar</button>
        <button id="btn-guardar" class="btn-filled" type="button">Guardar</button>
      </div>
    </div>
  </dialog>

  <!-- Menú selector de color de la app -->
  <div id="menu-color" class="menu-color" hidden>
    <p class="menu-color-tit">Color de la app</p>
    <div id="menu-color-swatches" class="colores"></div>
    <label class="color-custom">
      <input type="color" id="menu-color-custom" />
      <span>Personalizado</span>
    </label>
  </div>

  <!-- Menú de cuenta de Google -->
  <div id="menu-cuenta" class="menu-color" hidden>
    <div id="cuenta-conectado" hidden>
      <div class="cuenta-info">
        <img id="cuenta-foto" alt="" />
        <div class="cuenta-textos">
          <p id="cuenta-nombre"></p>
          <p id="cuenta-correo"></p>
        </div>
      </div>
      <p class="cuenta-sync">Tus datos se sincronizan con tu Google Drive.</p>
      <button id="btn-cerrar-sesion" class="btn-ghost" type="button">Cerrar sesión</button>
    </div>
    <div id="cuenta-desconectado">
      <p class="menu-color-tit">Sincroniza entre tus dispositivos</p>
      <button id="btn-iniciar-sesion" class="btn-filled" type="button">Iniciar sesión con Google</button>
    </div>
  </div>

  <!-- Diálogo Nueva/Editar materia -->
  <dialog id="dialogo-materia" class="dialogo">
    <div class="form">
      <h2 id="dialogo-materia-titulo">Nueva materia</h2>

      <label class="campo">
        <span class="etq">Nombre</span>
        <input type="text" id="campo-mat-nombre" maxlength="40" autocomplete="off" />
        <span class="error" id="error-mat-nombre"></span>
      </label>

      <div class="campo">
        <span class="etq">Color</span>
        <div id="campo-mat-colores" class="colores"></div>
        <label class="color-custom">
          <input type="color" id="campo-mat-color-custom" />
          <span>Personalizado</span>
        </label>
      </div>

      <div class="acciones">
        <button id="btn-mat-borrar" class="btn-ghost" type="button">Borrar</button>
        <span class="espaciador"></span>
        <button id="btn-mat-cancelar" class="btn-ghost" type="button">Cancelar</button>
        <button id="btn-mat-guardar" class="btn-filled" type="button">Guardar</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
